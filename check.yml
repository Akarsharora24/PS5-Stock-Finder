name: Zepto PS5 checker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: zepto-ps5-checker
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous notification state
        uses: actions/cache/restore@v4
        with:
          path: last_status.json
          key: zepto-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zepto-state-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check PS5 stock and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_status.json
          key: zepto-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
